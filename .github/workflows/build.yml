name: Build TikDown IPA

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number (e.g. 1.0.1)"
        required: false
        default: "1.0.0"

jobs:
  build:
    name: Build IPA
    runs-on: macos-14

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build Archive
        run: |
          xcodebuild archive \
            -project TikDown.xcodeproj \
            -scheme TikDown \
            -sdk iphoneos \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/TikDown.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | xcpretty

      # Debug: show what's actually inside the archive
      - name: List xcarchive contents
        run: find "$RUNNER_TEMP/TikDown.xcarchive" -type d | head -30

      - name: Package IPA (unsigned)
        run: |
          # Find .app wherever it actually landed
          APP_PATH=$(find "$RUNNER_TEMP/TikDown.xcarchive" -name "*.app" -type d | head -1)
          echo "App found at: $APP_PATH"

          mkdir -p "$RUNNER_TEMP/IPA/Payload"
          cp -r "$APP_PATH" "$RUNNER_TEMP/IPA/Payload/"
          cd "$RUNNER_TEMP/IPA"
          zip -r TikDown-unsigned.ipa Payload
          echo "IPA_PATH=$RUNNER_TEMP/IPA/TikDown-unsigned.ipa" >> $GITHUB_ENV

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: TikDown-v${{ github.event.inputs.version }}-unsigned
          path: ${{ env.IPA_PATH }}
          retention-days: 30

      - name: Upload dSYM
        uses: actions/upload-artifact@v4
        with:
          name: TikDown-v${{ github.event.inputs.version }}-dSYM
          path: ${{ runner.temp }}/TikDown.xcarchive/dSYMs
          retention-days: 30
