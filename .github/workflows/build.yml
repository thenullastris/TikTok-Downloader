name: Build TikDown IPA

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number (e.g. 1.0.1)"
        required: false
        default: "1.0.0"

jobs:
  build:
    name: Build IPA
    runs-on: macos-14  # Apple Silicon runner, faster

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────
      - name: Checkout repo
        uses: actions/checkout@v4

      # ── 2. Install XcodeGen ──────────────────────────────────────
      - name: Install XcodeGen
        run: brew install xcodegen

      # ── 3. Generate .xcodeproj from project.yml ──────────────────
      - name: Generate Xcode project
        run: xcodegen generate

      # ── 4. Build (unsigned) ──────────────────────────────────────
      - name: Build Archive
        run: |
          xcodebuild archive \
            -project TikDown.xcodeproj \
            -scheme TikDown \
            -sdk iphoneos \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/TikDown.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | xcpretty

      # ── 5. Package into unsigned IPA ─────────────────────────────
      - name: Package IPA (unsigned)
        run: |
          mkdir -p "$RUNNER_TEMP/IPA/Payload"
          cp -r "$RUNNER_TEMP/TikDown.xcarchive/Products/Applications/TikDown.app" \
                "$RUNNER_TEMP/IPA/Payload/"
          cd "$RUNNER_TEMP/IPA"
          zip -r TikDown-unsigned.ipa Payload
          echo "IPA_PATH=$RUNNER_TEMP/IPA/TikDown-unsigned.ipa" >> $GITHUB_ENV

      # ── 6. Upload IPA artifact ───────────────────────────────────
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: TikDown-v${{ github.event.inputs.version }}-unsigned
          path: ${{ env.IPA_PATH }}
          retention-days: 30

      # ── 7. Upload dSYM for crash symbolication (optional) ────────
      - name: Upload dSYM
        uses: actions/upload-artifact@v4
        with:
          name: TikDown-v${{ github.event.inputs.version }}-dSYM
          path: ${{ runner.temp }}/TikDown.xcarchive/dSYMs
          retention-days: 30
